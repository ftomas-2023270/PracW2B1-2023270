<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agregar Contacto</title>
    <link href="../style/stlcontact.css"  rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="d-flex">
        <!-- Menú lateral -->
        <div class="menu">
            <!-- Perfil del usuario -->
            <div class="user-profile">
                <h5>Perfil de Usuario</h5>
                <p id="userEmail">Cargando...</p>
                <button id="logoutButton" class="btn btn-sm btn-light">Cerrar sesión</button>
            </div>
    
            <!-- Opciones del menú -->
            <h4>Menú</h4>
            <a href="contact.html">Contactos</a>
            <a href="favorite.html">Favoritos</a>
            <a href="">Agregar Contacto</a>
            <a href="#todo">Lista ToDo</a>
        </div>
        <div class="content">
            <h2 class="text-center mb-4">Agregar Contacto</h2>
            <form>
                <div class="mb-3">
                    <label for="contactName" class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" id="contactName" placeholder="Ejemplo: Juan Pérez">
                </div>
                <div class="mb-3">
                    <label for="contactEmail" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="contactEmail" placeholder="Ejemplo: juan.perez@example.com">
                </div>
                <div class="mb-3">
                    <label for="contactPhone" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="contactPhone" placeholder="Ejemplo: +1 234 567 890">
                </div>
                <div class="mb-3">
                    <label for="contactAddress" class="form-label">Dirección</label>
                    <input type="text" class="form-control" id="contactAddress" placeholder="Ejemplo: Calle Falsa 123, Ciudad Ejemplo">
                </div>
                <div class="mb-3">
                    <label for="contactCompany" class="form-label">Empresa</label>
                    <input type="text" class="form-control" id="contactCompany" placeholder="Ejemplo: Ejemplo S.A.">
                </div>
                <button type="submit" class="btn btn-primary w-100">Guardar Contacto</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="utils.js"></script>
</body>
</html>
