<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista To Do</title>
    <link href="../style/stltodo.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="d-flex">
        <!-- Menú lateral -->
        <div class="menu">
            <div class="user-profile">
                <h5>Perfil de Usuario</h5>
                <p id="userEmail">Cargando...</p>
                <button id="logoutButton" class="btn btn-sm btn-light">Cerrar sesión</button>
            </div>
            <h4 class="text-white">Menú</h4>
            <a href="contact.html">Contactos</a>
            <a href="favorites.html">Favoritos</a>
            <a href="addcontact.html">Agregar Contacto</a>
            <a href="todo.html" class="active">Lista To-Do</a>
        </div>

        <!-- Contenido principal -->
        <div class="content p-4 w-100">
            <h2 class="mb-4">Lista To-Do</h2>

            <!-- Botón para agregar tarea -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>Tareas</h4>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal">
                    Agregar Tarea
                </button>
            </div>

            <!-- Lista de tareas -->
            <div class="task-container">
                <ul class="list-group" id="taskList">
                    <!-- Las tareas se generarán dinámicamente con el script -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Modal para agregar o editar tarea -->
    <div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addTaskModalLabel">Agregar Tarea</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="taskForm">
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label">Título</label>
                            <input type="text" class="form-control" id="taskTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="taskDetails" class="form-label">Detalles</label>
                            <textarea class="form-control" id="taskDetails" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="taskPriority" class="form-label">Prioridad</label>
                            <select class="form-select" id="taskPriority" required>
                                <option value="Alta">Alta</option>
                                <option value="Media">Media</option>
                                <option value="Baja">Baja</option>
                            </select>
                        </div>
                        <input type="hidden" id="taskId" value="">
                        <button type="submit" class="btn btn-primary w-100">Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../pages/todo.js"></script>
    <script src="../pages/utils.js"></script>
</body>
</html>
